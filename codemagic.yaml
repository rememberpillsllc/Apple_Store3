workflows:
  rememberpills_ios:
    name: RememberPills iOS
    instance_type: mac_mini_m2
    max_build_duration: 30
    integrations:
      app_store_connect: Codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.rememberpills.app
      vars:
        XCODE_PROJECT: RememberPills.xcodeproj
        XCODE_SCHEME: RememberPills
        BUNDLE_ID: com.rememberpills.app
      xcode: 26.0
    scripts:
      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies -project "$XCODE_PROJECT" -scheme "$XCODE_SCHEME"
      - name: Build IPA
        script: |
          set -e
          xcode-project use-profiles
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - build/**/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: false
        submit_to_app_store: false
